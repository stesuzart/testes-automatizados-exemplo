spring.application.name=teste-com-spring

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.path=/teste-spring-db
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segurança
# (opcional) desabilita frameOptions p/ console H2 na mesma origem
spring.web.resources.add-mappings=true
server.port=8080
security.jwt.secret=Troque-por-um-segredo-bem-grande-e-aleatorio-1234567890
security.jwt.expiration-seconds=3600