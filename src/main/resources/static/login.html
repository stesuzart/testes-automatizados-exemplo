<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h2>Login</h2>
<form method="post" action="/login">
    <label>Usuário:</label>
    <input type="text" name="username"><br><br>
    <label>Senha:</label>
    <input type="password" name="password"><br><br>
    <button type="submit">Entrar</button>
</form>

<p style="color:red;">
    <span th:if="${param.error}">Credenciais inválidas!</span>
    <span th:if="${param.logout}">Logout realizado com sucesso.</span>
</p>
</body>
</html>
